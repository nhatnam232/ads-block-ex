name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make assets
      - run: make chromium
      - run: make firefox
      - run: cd dist && zip -r ../ethereals-chromium.zip chromium && zip -r ../ethereals-firefox.zip firefox
      - uses: softprops/action-gh-release@v2
        with:
          files: 'ethereals-*.zip'
